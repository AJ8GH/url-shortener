---
services:
  url-shortener:
    container_name: url-shortener
    ports:
      - '8080:8080'
    build:
      dockerfile: Dockerfile
      context: .
    environment:
      DB_HOST: db
      REDIS_HOST: cache
    volumes:
      - .:/app
      - gradle_cache:/root/.gradle
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy

  db:
    container_name: db
    image: postgres:latest
    restart: always
    ports:
      - '5432:5432'
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_NAME}
      PGUSER: ${DB_NAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_NAME} -d ${DB_NAME} || exit 1" ]
      interval: 3s
      timeout: 3s
      retries: 5

  cache:
    image: redis:latest
    restart: always
    ports:
      - '6379:8080'
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli ping | grep PONG" ]
      interval: 1s
      timeout: 3s
      retries: 5
    command: [ "redis-server" ]
    container_name: cache

volumes:
  data:
  gradle_cache:
