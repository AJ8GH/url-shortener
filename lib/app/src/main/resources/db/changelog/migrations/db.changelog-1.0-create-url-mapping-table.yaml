databaseChangeLog:
  - changeSet:
      id: create-url-mapping-table
      author: aj8gh
      preConditions:
        - onFail: MARK_RAN
          not:
            - tableExists:
                tableName: url_mapping
      changes:
        - createTable:
            tableName: url_mapping
            columns:
              - column:
                  name: short_url_path
                  type: TEXT
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_url_mapping
                    nullable: false
                    unique: true
                    updatable: false
              - column:
                  name: long_url
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: expires_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValue: now()
                  constraints:
                    nullable: false
                    updatable: false
              - column:
                  name: updated_at
                  defaultValue: now()
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
