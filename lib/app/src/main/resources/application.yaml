spring:
  output:
    ansi:
      enabled: ALWAYS
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

management:
  endpoints:
    web:
      exposure:
        include: "*"

server:
  servlet:
    context-path: "" # Keep urls short

logging:
  level:
    org.springframework: INFO

app:
  scheme: ${APP_SCHEME:http}
  host: ${APP_HOST:localhost}
