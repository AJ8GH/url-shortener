[versions]
java = "25"
kotlin = "2.4.10"
kotlin-logging = "8.0.4"
junit = "6.1.3"
spring-boot = "4.1.1"
spring-dependency-management = "1.1.7"
kover = "0.9.9"
cucumber = "7.34.7"
kotest = "6.2.4"
embedded-redis = "1.4.4"
netty = "4.2.17.Final"

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-dependencyManagement = { id = "io.spring.dependency-management", version.ref = "spring-dependency-management" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }

[libraries]
kotlin-logging = { group = "io.github.oshai", name = "kotlin-logging-jvm", version.ref = "kotlin-logging" }
kotlin-reflect = { group = "org.jetbrains.kotlin", name = "kotlin-reflect" }
netty-buffer = { group = "io.netty", name = "netty-buffer", version.ref = "netty" }
netty-common = { group = "io.netty", name = "netty-common", version.ref = "netty" }
netty-handler = { group = "io.netty", name = "netty-handler", version.ref = "netty" }
netty-resolver = { group = "io.netty", name = "netty-resolver", version.ref = "netty" }
netty-resolver-dns = { group = "io.netty", name = "netty-resolver-dns", version.ref = "netty" }
netty-codec-base = { group = "io.netty", name = "netty-codec-base", version.ref = "netty" }
netty-codec-dns = { group = "io.netty", name = "netty-codec-dns", version.ref = "netty" }
netty-transport = { group = "io.netty", name = "netty-transport", version.ref = "netty" }
netty-transport-native-unix-common = { group = "io.netty", name = "netty-transport-native-unix-common", version.ref = "netty" }
spring-boot-starter-actuator = { group = "org.springframework.boot", name = "spring-boot-starter-actuator" }
spring-boot-starter-data-redis = { group = "org.springframework.boot", name = "spring-boot-starter-data-redis" }
spring-boot-starter-web = { group = "org.springframework.boot", name = "spring-boot-starter-web" }

cucumber-bom = { group = "io.cucumber", name = "cucumber-bom", version.ref = "cucumber" }
cucumber-java = { group = "io.cucumber", name = "cucumber-java" }
cucumber-junit-platform-engine = { group = "io.cucumber", name = "cucumber-junit-platform-engine" }
cucumber-spring = { group = "io.cucumber", name = "cucumber-spring" }
embedded-redis = { group = "com.github.codemonstur", name = "embedded-redis", version.ref = "embedded-redis" }
junit-jupiter = { group = "org.junit.jupiter", name = "junit-jupiter", version.ref = "junit" }
junit-platform-engine = { group = "org.junit.platform", name = "junit-platform-engine", version.ref = "junit" }
junit-platform-launcher = { group = "org.junit.platform", name = "junit-platform-launcher" }
junit-platform-suite = { group = "org.junit.platform", name = "junit-platform-suite", version.ref = "junit" }
spring-boot-starter-test = { group = "org.springframework.boot", name = "spring-boot-starter-test" }
kotest-assertions-core = { group = "io.kotest", name = "kotest-assertions-core", version.ref = "kotest" }

[bundles]
app = [
  "kotlin-logging",
  "kotlin-reflect",
  "netty-buffer",
  "netty-codec-base",
  "netty-codec-dns",
  "netty-common",
  "netty-handler",
  "netty-resolver",
  "netty-resolver-dns",
  "netty-transport",
  "netty-transport-native-unix-common",
  "spring-boot-starter-actuator",
  "spring-boot-starter-data-redis",
  "spring-boot-starter-web",
]

componentTest = [
  "cucumber-java",
  "cucumber-junit-platform-engine",
  "cucumber-spring",
  "embedded-redis",
  "junit-platform-engine",
  "junit-platform-suite",
  "kotest-assertions-core",
  "spring-boot-starter-test",
]
